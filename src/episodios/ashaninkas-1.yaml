    transcricao: |
      ABC da Amazônia, Ashaninkas.
      Marechal Thaumaturgo, estado do Acre, quase fronteira com o Peru.
      Deste local, numa viagem de barco que demora mais de 5 horas, chega-se à aldeia dos índios Ashaninkas.
      Eles usam roupas vistosas feitas de algodão, e o efeite na cabeça é de folhas de palmeira. 
      No Brasil, vivem algumas centenas de Ashaninkas. A grande maioria, mais de 50 mil índios, habita a Amazônia peruana, é uma das maiores populações indígenas da América do Sul.
      Ao longo dos séculos, os Ashaninkas têm conseguido preservar sua identidade cultural.
      Aulas como essa, ao ar livre, são diárias. Nelas, os mais velhos contam as histórias da tribo para os mais novos.
      ABC da Amazônia, oferecimento:
      Natura Ekos, você é responsável por suas escolhas.