      ABC da Amazônia, Barcelos.
      A cidade foi a primeira capital do Estado do Amazonas, fica às margens do Rio Negro a 400 km de Manaus.
      O município é um dos maiores do Brasil, tem quatro vezes o tamanho da Bélgica.
      Vive principalmente da exportação de peixes ornamentais e também do turismo.
      Cercada pelas águas escuras que, em contraste com o branco da areia, ganham tons avermelhados, as praias se espalham por mais de mil ilhas no maior arquipélago fluvial do mundo.
      Quem procura a pesca esportiva do Tucunaré em Barcelos, também se impressiona com o espetáculo da natureza.
