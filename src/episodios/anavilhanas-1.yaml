      ABC da Amazônia, Anavilhanas 
      No Rio Negro, entre Manaus e o município de Novo Airão, fica uma das grandes atrações para os turistas que visitam a Amazônia, o arquipélago das Anavilhanas.
      São 400 ilhas, centenas de lagos, rios, igapós e igarapés, ricos em espécies vegetais e animais.
      Uma das bases de fiscalização e pesquisa do Ibama fica na estação ecológica das Aravilhanas, proteção contra a pesca e a caça predatórias.
      Não é raro encontrar animais perdidos nos canais do arquipélago, como este Macaco Cheiro.
      Do alto se tem a melhor visão das Anavilhanas, a principal ilha do arquipélago, tem uma extensão de 60 km.
      Oferecimento: 
      Banco do Planeta, investindo na conservação da Amazônia.
      E Natura Ekos, siga sua sabedoria.
